[package]
name = "open-scribe-asr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
open-scribe-types = { path = "../open-scribe-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# ADR 0008 engine: vendors whisper.cpp 1.8.3 (2eeeba56) and builds it in process.
whisper-rs-sys = { version = "=0.15.0", features = ["metal"] }

[lib]
path = "src/lib.rs"
