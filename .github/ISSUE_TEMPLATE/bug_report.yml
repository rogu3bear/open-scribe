name: Developer preview bug
description: Report a source or unsigned-development-build problem without private content.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        This is public. Do not attach recordings, transcripts, OCR, screen content, databases, portable packages, credentials or private paths.
        For vulnerabilities/privacy exposure use [private reporting](https://github.com/rogu3bear/open-scribe/security/advisories/new).
        Read [support and recovery limits](https://github.com/rogu3bear/open-scribe/blob/main/SUPPORT.md). No supported app release exists.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report check
      options:
        - label: I removed private content and this is not a suspected security or privacy vulnerability.
          required: true
  - type: input
    id: source
    attributes:
      label: Source commit and candidate/build identity
      description: Provide known identities. Write unknown rather than guessing.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS version and Apple Silicon model
      description: Omit serial numbers, account names and device identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Nonprivate reproduction
      description: Give the operation, steps, visible state/error, expected result and actual result. Use synthetic inputs; do not upload private artifacts or raw logs.
    validations:
      required: true
