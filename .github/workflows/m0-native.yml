name: P1 foundation proof

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: p1-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-proof:
    name: SSR / WASM / Rust / Xcode
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select pinned Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_$(<.xcode-version).app/Contents/Developer"

      - name: Install shell proof tools
        run: brew install shellcheck shfmt

      - name: Install pinned web proof tools
        run: |
          source web/toolchain.env
          npm install --global "bun@${OPEN_SCRIBE_BUN_VERSION}"
          cargo install cargo-leptos --version "${OPEN_SCRIBE_CARGO_LEPTOS_VERSION}" --locked
          cargo install worker-build --version "${OPEN_SCRIBE_WORKER_BUILD_VERSION}" --locked

      - name: Verify the complete bounded foundation
        run: ./script/check.sh --m1-media-open
